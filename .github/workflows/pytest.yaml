name: Run Unit Test via Pytest

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check lock file is up to date
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --extra test
      # Test environment (ARGOCLI_* env vars, mocked keyring) is set up in
      # tests/conftest.py at import time, so no CI-specific env is needed here.
      - name: Test with pytest
        run: uv run pytest --doctest-modules --cov=argocli --cov-report=term
