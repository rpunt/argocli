name: Run Unit Test via Pytest

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check lock file is up to date
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --extra test
      # Test environment (ARGOCLI_* env vars, mocked keyring) is set up in
      # tests/conftest.py at import time, so no CI-specific env is needed here.
      - name: Test with pytest
        run: uv run pytest --doctest-modules --cov=argocli --cov-report=term
