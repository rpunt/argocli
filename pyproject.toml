[project]
name = "argocli"
version = "0.4.0"
description = "A command-line interface for Argo Workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cac-core>=2.0.1,<3.0.0",
    "packaging>=25.0",
    "requests>=2.32.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.3.1",
    "pytest-cov>=4.0.0",
]

[project.scripts]
argocli = "argocli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
